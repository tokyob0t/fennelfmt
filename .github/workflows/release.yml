name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install fennel-ls
        run: luarocks install fennel-ls
      - name: Run checks
        run: make check
      - name: Build binary
        run: |
          make fnlfmt
          cp fnlfmt "fnlfmt-${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "fnlfmt ${GITHUB_REF_NAME}" \
            --generate-notes \
            "fnlfmt-${GITHUB_REF_NAME}" \
            fnlfmt.1
